[project]
name = "retail-supply-chain-risk-backend"
version = "0.1.0"
description = "Retail Supply Chain Risk Backend"
authors = [{name = "Your Name", email = "you@example.com"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.4",
    "uvicorn>=0.32.0",
    "motor>=3.6.0",
    "pymongo>=4.10.1",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "sse-starlette>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
